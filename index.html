<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@hamma-nyk (イコ)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
      />
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gh_bg: "#0d1117",
              gh_card: "#161b22",
              gh_border: "#30363d",
              gh_text: "#c9d1d9",
              gh_muted: "#8b949e",
              gh_blue: "#58a6ff",
              gh_green: "#238636",
              gh_green_text: "#3fb950",
              gh_hover: "#1f242c",
              gh_modal_header: "#1c2128",
            },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"Segoe UI"',
                "Helvetica",
                "Arial",
                "sans-serif",
              ],
              mono: [
                "ui-monospace",
                "SFMono-Regular",
                "SF Mono",
                "Menlo",
                "Consolas",
                "Liberation Mono",
                "monospace",
              ],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body
    class="bg-gh_bg text-gh_text font-sans antialiased relative min-h-screen"
    >
    <div class="aurora-bg">
      <div class="aurora-blob blob-1"></div>
      <div class="aurora-blob blob-2"></div>
      <div class="aurora-blob blob-3"></div>
    </div>
    <div class="container mx-auto max-w-full p-4 lg:p-8 relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-4 space-y-6">
        <div class="bg-gh_card/90 backdrop-blur-xl p-6 rounded-2xl border border-gh_border shadow-lg relative overflow-hidden">
          <div class="absolute inset-x-0 top-0 h-32 z-0 pointer-events-none">
            <img src="assets/img/profile-bg.png" class="w-full h-full object-cover opacity-40" loading="lazy" />
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-gh_card"></div>
          </div>
          <div class="relative z-10 flex flex-col items-center">
            <div class="flex justify-center mb-4 mt-4">
              <img src="assets/img/xnxx.png" class="w-24 h-24 rounded-full object-cover border-4 border-gh_card shadow-xl profile-noise" loading="lazy" />
            </div>
            <div class="text-center mb-4">
              <h1 class="text-xl font-bold text-white">イコ</h1>
              <p class="text-gh_muted text-sm italic">@hamma-nyk</p>
            </div>
            <div id="tags-container" class="flex flex-wrap gap-1.5 justify-center"></div>
          </div>
        </div>
        <div class="bg-gh_card/80 backdrop-blur-xl p-5 rounded-2xl border border-gh_border shadow-lg flex flex-col">
          <div class="flex justify-between items-center pb-2 mb-4 border-b border-white/10">
            <span class="text-[9px] text-gh_blue font-bold tracking-widest uppercase">SIMPLE PLAYLIST</span>
            <i class="ri-disc-line text-gh_blue animate-spin text-sm"></i>
          </div>
          <div class="relative overflow-hidden rounded-xl border border-gh_border/40 p-4 mb-4">
            <div class="absolute inset-0 z-0 pointer-events-none">
              <img
                id="player-bg"
                src="assets/img/music-bg.jpg"
                alt="Player Background"
                class="w-full h-full object-cover opacity-30 blur-[1px]"
                loading="lazy"
                />
              <div
                class="absolute inset-0 bg-gradient-to-t from-gh_card via-gh_card/80 to-transparent"
                ></div>
            </div>
            <div class="relative z-10 w-full flex flex-col">
              <div class="flex items-start gap-5 mb-6 justify-start">
                <img
                  id="player-album"
                  src=""
                  alt="Album"
                  class="w-20 h-20 rounded-md border border-white/10 shadow-[0_4px_12px_rgba(0,0,0,0.5)] flex-shrink-0 object-cover"
                  />
                <div class="text-left max-w-[150px] sm:max-w-[200px]">
                  <h3
                    id="player-title"
                    class="text-xl font-bold text-white drop-shadow-md truncate"
                    >
                    Loading...
                  </h3>
                  <p
                    id="player-artist"
                    class="text-gh_muted text-sm font-medium drop-shadow-md truncate"
                    >
                    Please wait
                  </p>
                </div>
              </div>
              <div class="flex justify-center items-center gap-6 mb-5">
                <button
                  id="prev-btn"
                  class="text-gh_text hover:text-white transition drop-shadow-md focus:outline-none"
                  >
                <i class="ri-skip-back-mini-fill text-2xl"></i>
                </button>
                <button
                  id="play-btn"
                  class="w-12 h-12 rounded-full bg-gh_green border border-green-500/30 text-white flex items-center justify-center hover:bg-green-500 transition-all shadow-[0_0_15px_rgba(35,134,54,0.4)] focus:outline-none"
                  >
                <i id="icon-play" class="ri-play-fill text-2xl ml-1"></i>
                <i id="icon-pause" class="ri-pause-fill text-2xl hidden"></i>
                </button>
                <button
                  id="next-btn"
                  class="text-gh_text hover:text-white transition drop-shadow-md focus:outline-none"
                  >
                <i class="ri-skip-forward-mini-fill text-2xl"></i>
                </button>
              </div>
              <div
                class="w-full bg-black/40 rounded-full h-1.5 relative border border-white/5 cursor-pointer shadow-inner"
                id="progress-container"
                >
                <div
                  id="progress-bar"
                  class="bg-gh_green_text h-1.5 rounded-full shadow-[0_0_8px_rgba(63,185,80,0.6)]"
                  style="width: 0%"
                  ></div>
              </div>
            </div>
          </div>
          <div id="playlist-container" class="space-y-1 overflow-y-auto max-h-[150px] custom-scrollbar pr-1 text-xs"></div>
          <audio id="audio-player" src="" preload="metadata"></audio>
        </div>
      </div>
      <div class="lg:col-span-4 space-y-4">
        <div class="lg:flex items-center gap-2 mb-2">
          <h3 class="text-sm font-bold text-gh_muted uppercase tracking-tighter">Featured Projects</h3>
          <div class="flex-grow h-px bg-gh_border/30"></div>
        </div>
        <div id="projects-container-1" class="space-y-4"></div>
      </div>
      <div class="lg:col-span-4 mt-[-8px] lg:mt-0 lg:space-y-4">
        <div class="hidden lg:flex items-center gap-2 mb-2">
          <h3 class="text-sm font-bold text-gh_muted uppercase tracking-tighter">More Projects</h3>
          <div class="flex-grow h-px bg-gh_border/30"></div>
        </div>
        <div id="projects-container-2" class="space-y-4"></div>
      </div>
    </div>
    <div
      id="project-modal"
      class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-gh_bg/80 backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300"
      >
      <div
        id="modal-content"
        class="bg-gh_card border border-gh_border rounded-xl shadow-2xl w-full max-w-2xl transform scale-95 transition-all duration-300 flex flex-col overflow-hidden max-h-[90vh]"
        >
        <div
          class="flex justify-between items-center px-5 py-4 border-b border-gh_border bg-gh_modal_header"
          >
          <h3
            id="modal-title"
            class="text-lg font-semibold text-gh_text flex items-center gap-2"
            >
            <svg
              class="w-4 h-4 text-gh_muted"
              fill="currentColor"
              viewBox="0 0 16 16"
              >
              <path
                fill-rule="evenodd"
                d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"
                ></path>
            </svg>
            Nama Proyek
          </h3>
          <div class="flex items-center gap-2">
            <button
              onclick="openFullscreenModal()"
              class="text-gh_muted hover:text-white transition focus:outline-none p-1"
              title="Fullscreen"
              >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5v4m0-4h-4m4 0l-5 5M4 20v-4m0 4h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5"></path>
              </svg>
            </button>
            <button
              onclick="closeModal()"
              class="text-gh_muted hover:text-white transition focus:outline-none"
              >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                  ></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="p-5 overflow-y-auto custom-scrollbar">
          <div
            class="mb-5 border border-gh_border rounded-lg overflow-hidden bg-gh_bg"
            >
            <img
              id="modal-image"
              src=""
              alt="Screenshot Proyek"
              class="w-full h-auto object-cover max-h-[300px]"
              />
          </div>
          <p
            id="modal-desc"
            class="text-gh_text text-sm mb-6 leading-relaxed"
            ></p>
          <div class="flex flex-wrap gap-3">
            <a
              id="modal-github"
              href="#"
              target="_blank"
              class="hidden items-center gap-2 bg-[#238636] hover:bg-[#2ea043] text-white px-4 py-2 rounded-md text-sm font-semibold transition border border-[rgba(240,246,252,0.1)]"
              >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                  />
              </svg>
              View on GitHub
            </a>
            <a
              id="modal-website"
              href="#"
              target="_blank"
              class="hidden items-center gap-2 bg-[#21262d] hover:bg-[#30363d] text-gh_text px-4 py-2 rounded-md text-sm font-semibold transition border border-gh_border"
              >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
                >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                  ></path>
              </svg>
              Visit Website
            </a>
          </div>
        </div>
      </div>
    </div>
    <div
      id="fullscreen-modal"
      class="fullscreen-modal hidden"
      onclick="closeFullscreenModal()"
      >
      <button
        class="absolute top-4 right-4 text-white hover:text-gh_muted transition focus:outline-none z-50"
        onclick="closeFullscreenModal(event)"
        title="Close Fullscreen"
        >
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      <img id="fullscreen-image" src="" alt="Fullscreen Screenshot" />
    </div>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
